<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reloj Laboral - Gato Dev</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .clock-card {
      width: 100%;
      height: 100%;
      background: #fffaf0;
      border: 2.5px solid #4a2e1b;
      border-radius: 14px;
      padding: 7px 10px;
      color: #4a2e1b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 3px 0 rgba(74, 46, 27, 0.25);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* Vista activa durante el turno */
    .active-view {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .clock-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      color: #7d4e2d;
      white-space: nowrap;
    }

    .clock-time {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.1;
    }

    .clock-sub {
      font-size: 11px;
      font-weight: bold;
      color: #5d9b6b;
    }

    /* Vista de cierre al llegar a 17:00 */
    .clock-card.finished {
      background: #f9e6d4;
      border-color: #8c4a27;
      justify-content: space-between;
    }

    .clock-card.finished .active-view {
      display: none;
    }

    .summary-view {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      gap: 3px;
    }

    .clock-card.finished .summary-view {
      display: flex;
    }

    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      color: #8c4a27;
    }

    .summary-badge {
      background: #4a2e1b;
      color: #fffaf0;
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 9px;
    }

    .summary-phrase {
      font-size: 10.5px;
      line-height: 1.2;
      font-weight: bold;
      color: #4a2e1b;
    }

    .reset-btn {
      align-self: stretch;
      background: #5d9b6b;
      color: #fffaf0;
      border: 1.5px solid #4a2e1b;
      border-radius: 7px;
      padding: 3px 6px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 2px 0 #4a2e1b;
    }

    .reset-btn:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #4a2e1b;
    }
  </style>
</head>
<body>
  <div class="clock-card" id="clockCard">
    <!-- MODO RELOJ NORMAL -->
    <div class="active-view">
      <div class="clock-top">
        <span>🕒 TURNO GATO DEV</span>
        <span id="remainingLabel">12:00</span>
      </div>
      <div class="clock-time" id="simClock">09:00</div>
      <div class="clock-sub">En horario laboral</div>
    </div>

    <!-- MODO RESUMEN DE FIN DE JORNADA -->
    <div class="summary-view">
      <div class="summary-header">
        <span>🌙 ¡Turno completado!</span>
        <span class="summary-badge">09:00 → 17:00</span>
      </div>
      <div class="summary-phrase" id="closingPhrase">
        Gato Dev cierra la compu y va a descansar 🐾
      </div>
      <button type="button" class="reset-btn" onclick="restartShift()">
        ☀️ Empezar nuevo día
      </button>
    </div>
  </div>

  <script>
    // 12 minutos = 720 segundos (cámbialo a 8 o 10 solo si quieres testear rápido)
    const totalSeconds = 12 * 60;
    const STORAGE_KEY = "gatoDev_workday_endTime_v2";
    const PHRASE_KEY = "gatoDev_workday_phrase_v2";

    const closingPhrases = [
      "Gato Dev cierra la compu, apaga el monitor y va a descansar 🐾",
      "¡Misión cumplida! Hora de un café calentito en la sala de relax ☕",
      "Red segura y jornada lista. ¡A dormir como un buen michi! 💤",
      "Fin del turno en CatOS: nada como desconectar después de programar 🐱"
    ];

    function createNewShift() {
      const newEndTime = Date.now() + totalSeconds * 1000;
      const randomPhrase = closingPhrases[Math.floor(Math.random() * closingPhrases.length)];
      sessionStorage.setItem(STORAGE_KEY, String(newEndTime));
      sessionStorage.setItem(PHRASE_KEY, randomPhrase);
      return newEndTime;
    }

    function getEndTime() {
      const saved = sessionStorage.getItem(STORAGE_KEY);
      if (saved) return Number(saved);
      return createNewShift();
    }

    let endTime = getEndTime();

    function formatOfficeClock(elapsed, total) {
      const progress = Math.min(1, Math.max(0, elapsed / total));
      const totalMinutes = Math.floor(progress * 480);
      const hour = 9 + Math.floor(totalMinutes / 60);
      const minute = totalMinutes % 60;
      return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
    }

    function formatRemaining(seconds) {
      const safeSec = Math.max(0, seconds);
      const mins = Math.floor(safeSec / 60);
      const secs = safeSec % 60;
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function restartShift() {
      endTime = createNewShift();
      document.getElementById("clockCard").classList.remove("finished");
      updateClock();
    }

    function updateClock() {
      const now = Date.now();
      const leftSeconds = Math.max(0, Math.ceil((endTime - now) / 1000));
      const elapsed = totalSeconds - leftSeconds;

      if (leftSeconds <= 0) {
        const card = document.getElementById("clockCard");
        if (!card.classList.contains("finished")) {
          const phrase = sessionStorage.getItem(PHRASE_KEY) || closingPhrases[0];
          document.getElementById("closingPhrase").textContent = phrase;
          card.classList.add("finished");
        }
        return;
      }

      document.getElementById("simClock").textContent = formatOfficeClock(elapsed, totalSeconds);
      document.getElementById("remainingLabel").textContent = formatRemaining(leftSeconds);
    }

    updateClock();
    setInterval(updateClock, 500);
  </script>
</body>
</html>
